# Printer profile and tolerances. Every model takes its values from here instead of hard-coding them.
# Decisions from the spec (2026-11-03): nozzle 0.4, Windows, PNG + OCP viewer,
# STEP+STL+3MF output, GitHub (private at first, public now), PLA by default.

[printer]
model = "Bambu Lab P2S"
build_volume_mm = [256, 256, 256]   # Bambu Lab's official figures
bed_margin_mm = 5                   # margin to the bed's edge in the size check
nozzle_mm = 0.4                     # the nozzle in use; switch to one of [nozzles.*]
material = "PLA"                    # default plastic; switch to one of [materials.*]

# Nozzle profiles. min_wall = 3 perimeters; follows nozzle_mm above.
[nozzles."0.2"]
min_wall_mm = 0.6
layer_mm = 0.1
[nozzles."0.4"]
min_wall_mm = 1.2
layer_mm = 0.2
[nozzles."0.6"]
min_wall_mm = 1.8
layer_mm = 0.3
[nozzles."0.8"]
min_wall_mm = 2.4
layer_mm = 0.4

[tolerances]           # starting values for a 0.4 nozzle and PLA, refined by calibration
hole_clearance_mm = 0.2      # added to the diameter of a hole for a shaft/screw
press_fit_mm = 0.05
slide_fit_mm = 0.3

# Per-plastic additions to the tolerances (added to [tolerances]) and hints.
[materials.PLA]
clearance_add_mm = 0.0
density_g_cm3 = 1.24
# price_per_kg = 0          # spool price in [estimate] currency; set it to see the cost in the build report
note = "stiff, precise; softens from 55 °C: not for a car interior or boiling water"
[materials.PETG]
clearance_add_mm = 0.05
density_g_cm3 = 1.27
note = "tough, impact-resistant, up to ~75 °C; slightly larger clearances, strings"
[materials.ABS]
clearance_add_mm = 0.1
density_g_cm3 = 1.04
note = "up to ~95 °C, shrinks ~0.5–0.7 %; print with the lid closed"
[materials.ASA]
clearance_add_mm = 0.1
density_g_cm3 = 1.07
note = "like ABS but UV-resistant, for outdoors; enclosed chamber"

# Filament estimate in the build report (cadlib/estimate.py): shells + infill, ±20% of the slicer.
[estimate]
infill_share = 0.15         # slicer's sparse infill density
currency = "UAH"            # for price_per_kg in [materials.*]
