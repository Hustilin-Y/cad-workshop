[project]
name = "cad-workshop"
version = "0.1.0"
description = "Параметрические детали и ремиксы под 3D-печать на Bambu Lab P2S"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13.0",
    "fast-simplification>=0.2.0",
    "lxml>=6.1.3",
    "manifold3d>=3.5.4",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pillow>=11.0",       # tools/logo_extract.py
    "scipy>=1.14",        # проверки: выпуклая оболочка основания, связность площадок
    "trimesh>=5.2.0",
]

[dependency-groups]
viewer = [  # живой 3D-просмотр, только на ПК: uv run --group viewer python -m ocp_viewer
    "ocp-viewer>=1.2.0",
    "ocp-vscode>=4.2.0",
]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
link-mode = "copy"   # кэш uv и проект на разных дисках, hardlink невозможен

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
