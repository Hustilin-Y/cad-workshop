[project]
name = "cad-workshop"
version = "0.1.0"
description = "Parametric parts and remixes for 3D printing on a Bambu Lab P2S"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13.0",
    "fast-simplification>=0.2.0",
    "lxml>=6.1.3",
    "manifold3d>=3.5.4",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pillow>=11.0",       # tools/logo_extract.py
    "scipy>=1.14",        # checks: the base's convex hull, plateau connectivity
    "trimesh>=5.2.0",
]

[dependency-groups]
viewer = [  # live 3D view, PC only: uv run --group viewer python -m ocp_viewer
    "ocp-viewer>=1.2.0",
    "ocp-vscode>=4.2.0",
]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
link-mode = "copy"   # the uv cache and the project are on different drives, hardlinks are impossible

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
