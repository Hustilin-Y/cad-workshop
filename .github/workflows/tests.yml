name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Linux like the home server the workshop also runs on: catches what Windows hides
    # (no Arial, no libGL, case-sensitive paths). The logo data is private, so its tests skip here.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Tests
        run: uv run pytest -q
      - name: Build every model
        run: uv run cad.py build --all
